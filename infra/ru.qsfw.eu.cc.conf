server
{
    listen 80;
    listen [::]:80;
    server_name ru.qsfw.eu.cc;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /www/wwwroot/ru.qsfw.eu.cc;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    access_log /www/wwwlogs/ru.qsfw.eu.cc.log;
    error_log /www/wwwlogs/ru.qsfw.eu.cc.error.log;
}

server
{
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ru.qsfw.eu.cc;

    ssl_certificate /etc/letsencrypt/live/ru.qsfw.eu.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ru.qsfw.eu.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 13h;
        proxy_send_timeout 13h;
        client_max_body_size 32m;
    }

    access_log /www/wwwlogs/ru.qsfw.eu.cc.log;
    error_log /www/wwwlogs/ru.qsfw.eu.cc.error.log;
}
