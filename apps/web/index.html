<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fafafa" />
    <meta name="description" content="LinguaFlow 实时双语语音翻译" />
    <title>LinguaFlow · 实时双语翻译</title>
    <script>
      /* Resolves the theme before first paint so a dark room never gets a white flash. */
      (function () {
        try {
          var saved = localStorage.getItem('linguaflow_theme');
          var choice = saved === 'light' || saved === 'dark' ? saved : null;
          var dark = choice ? choice === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.querySelector('meta[name="theme-color"]').content = dark ? '#000000' : '#fafafa';
        } catch (error) { document.documentElement.dataset.theme = 'light'; }
      })();
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
